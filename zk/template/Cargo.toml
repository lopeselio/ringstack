[package]
name = "zk-template"
version = "0.1.0"
description = "Template SPP ZK program: a timelocked vault on spr-program 0.8."
edition = "2021"
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "zk_template"
crate-type = ["cdylib", "lib"]

[features]
# Every local setup, test seed or not, is exported as SetupKind::InsecureTest,
# and its verifying keys do not compile without this feature. Only keys from a
# validated ceremony are Production.
default = ["insecure-test-setup"]
insecure-test-setup = []
no-entrypoint = []
circuits = [
    "dep:borsh",
    "dep:solana-instruction",
    "dep:spr-keypair",
    "dep:spr-transaction",
    "spr-program/client",
    "spr-program/setup",
    "spr-program/parallel",
]
wasm = [
    "dep:borsh",
    "dep:spr-keypair",
    "dep:spr-transaction",
    "spr-program/wasm",
]
r1cs-export = ["spr-program/r1cs-export"]
harness = ["circuits", "ringstack-zk-gadgets/harness"]

[dependencies]
borsh = { version = "1.5", default-features = false, features = ["derive"], optional = true }
pinocchio = { version = "0.11", features = ["cpi", "sha2"] }
ringstack-zk-gadgets = { path = "../gadgets" }
solana-instruction = { version = "3.4", optional = true }
solana-program-error = "3.0"
spr-account-checks = { version = "=0.8.0", default-features = false }
spr-hasher = { version = "=0.8.0", default-features = false }
spr-interface = "=0.8.0"
spr-keypair = { version = "=0.8.0", optional = true }
spr-program = { workspace = true, features = ["cpi", "compression", "verifier"] }
spr-transaction = { version = "=0.8.0", optional = true }
thiserror = { version = "2.0", default-features = false }
wincode = { version = "0.5", default-features = false, features = ["derive", "alloc"] }

# solana-ed25519 pulls getrandom 0.4 through rand 0.10; on wasm32 it needs its
# browser/Node backend, which spr-keypair enables only for 0.2 and 0.3.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lints.rust.unexpected_cfgs]
level = "allow"
check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(feature, values("frozen-abi", "no-entrypoint"))',
]

[dev-dependencies]
solana-signature = "3.4"

[[test]]
name = "circuits"
required-features = ["harness"]

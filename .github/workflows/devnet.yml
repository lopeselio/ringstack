name: devnet

# End-to-end suites against Solana devnet (zolana 0.8, Helius gateway, attested
# prover). Needs two repository secrets:
#   API_KEY                 Helius API key
#   DEVNET_FUNDER_KEYPAIR   JSON keypair (Solana CLI format) holding devnet SOL
# One run spends about 0.9 SOL on fees, rent and test deposits.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

concurrency:
  group: devnet
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ZOLANA_NETWORK: devnet
      API_KEY: ${{ secrets.API_KEY }}
      ZOLANA_FUNDER_KEYPAIR: ${{ github.workspace }}/.devnet/funder.json
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Write funder keypair
        env:
          DEVNET_FUNDER_KEYPAIR: ${{ secrets.DEVNET_FUNDER_KEYPAIR }}
        run: |
          test -n "$API_KEY" || { echo "missing secret API_KEY"; exit 1; }
          test -n "$DEVNET_FUNDER_KEYPAIR" || { echo "missing secret DEVNET_FUNDER_KEYPAIR"; exit 1; }
          umask 077
          mkdir -p .devnet
          printf '%s' "$DEVNET_FUNDER_KEYPAIR" > .devnet/funder.json
      - run: pnpm --filter @ringstack/core e2e
      - run: pnpm --filter @ringstack/ringd e2e
      - run: pnpm --filter @ringstack/payroll e2e
      - if: always()
        run: rm -f .devnet/funder.json

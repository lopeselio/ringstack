name: docs

# Builds apps/docs and apps/verifier and publishes them to GitHub Pages:
#   https://lopeselio.github.io/ringstack/          docs
#   https://lopeselio.github.io/ringstack/verify/   receipt and proof verifier
# The docs are generated from the repo's specs, guides and READMEs, so the site
# redeploys when any of them, the verifier, or the core library change.
on:
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
      - "docs/**"
      - "spec/**"
      - "apps/*/README.md"
      - "packages/*/README.md"
      - "apps/verifier/**"
      - "packages/core/src/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ringstack/docs build
      - run: pnpm --filter @ringstack/verifier build
      # The verifier's build uses relative asset paths, so it works from /verify/.
      - run: cp -R apps/verifier/dist apps/docs/dist/verify
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

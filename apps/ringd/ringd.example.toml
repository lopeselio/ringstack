# ringd configuration. Paths are relative to this file.
network = "localnet"          # "localnet" or "devnet"
database = "./ringd.db"
poll_interval_secs = 5
# The Helius API key (devnet) is read from RINGD_API_KEY or API_KEY, never from this file.

# [endpoints]                 # optional per-service overrides
# rpc_url = "https://…"
# indexer_url = "https://…"   # e.g. a self-hosted Photon indexer
# prover_url = "https://…"

[[wallet]]
name = "shop"
key_file = "./shop.ringd-key.json"   # from `ringd keys export`

# [[webhook]]
# name = "orders"
# url = "https://shop.example/hooks/ringd"   # http:// only for localhost
# secret_env = "RINGD_WEBHOOK_SECRET"        # env var holding the HMAC secret (≥ 16 chars)
# events = ["payment.received"]              # optional filter
# wallets = ["shop"]                         # optional filter

# [delivery]                                 # optional; defaults shown
# timeout_secs = 10
# max_attempts = 12
# retry_base_secs = 5
# retry_max_secs = 3600
